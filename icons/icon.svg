<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2a1f1a"/>
    <stop offset="100%" stop-color="#1a1210"/>
  </linearGradient>
  <linearGradient id="pgL" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f5ede0"/>
    <stop offset="100%" stop-color="#e0cfb8"/>
  </linearGradient>
  <linearGradient id="pgR" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8d9c5"/>
    <stop offset="100%" stop-color="#d4c4a8"/>
  </linearGradient>
</defs>
<!-- 배경 원 -->
<circle cx="50" cy="50" r="48" fill="url(#bgG)"/>
<!-- 액센트 링 -->
<circle cx="50" cy="50" r="45" fill="none" stroke="#c8503c" stroke-width="2" stroke-opacity="0.6"/>
<!-- ── 책 왼쪽 페이지 ── -->
<path d="M17 27 Q17 25 19 25 L48 27 L48 75 L19 73 Q17 73 17 71 Z" fill="url(#pgL)"/>
<!-- 왼쪽 페이지 내지 그림자선 -->
<path d="M45 27 L48 27 L48 75 L45 75 Z" fill="#c0a880" opacity="0.4"/>
<!-- ── 책 오른쪽 페이지 ── -->
<path d="M52 27 L81 25 Q83 25 83 27 L83 71 Q83 73 81 73 L52 75 Z" fill="url(#pgR)"/>
<!-- 오른쪽 페이지 내지 그림자선 -->
<path d="M52 27 L55 27 L55 75 L52 75 Z" fill="#a89068" opacity="0.4"/>
<!-- 척추(spine) -->
<rect x="48" y="27" width="4" height="48" fill="#2e1e14"/>
<!-- 책등 하단 볼륨감 -->
<path d="M17 71 Q17 76 21 77 L48 79 L52 79 L79 77 Q83 76 83 71 L83 73 Q83 78 79 79 L52 81 L48 81 L21 79 Q17 78 17 73 Z" fill="#1e1208" opacity="0.85"/>
<!-- ── 왼쪽 페이지: 텍스트 라인 ── -->
<line x1="22" y1="34" x2="44" y2="34" stroke="#b0987a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="22" y1="39" x2="44" y2="39" stroke="#b0987a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="22" y1="44" x2="44" y2="44" stroke="#b0987a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="22" y1="49" x2="38" y2="49" stroke="#b0987a" stroke-width="1.4" stroke-linecap="round"/>
<!-- ── 왼쪽 페이지: 디지털 신호 노드 (액센트 #c8503c) ── -->
<!-- 수직 신호선 -->
<line x1="28" y1="58" x2="28" y2="53" stroke="#c8503c" stroke-width="1.3"/>
<!-- 수평 연결선 -->
<line x1="28" y1="63" x2="36" y2="63" stroke="#c8503c" stroke-width="1.3"/>
<!-- 메인 솔리드 노드 -->
<circle cx="28" cy="58" r="2.5" fill="#c8503c"/>
<!-- 보조 링 노드 -->
<circle cx="28" cy="53" r="1.8" fill="none" stroke="#c8503c" stroke-width="1.2"/>
<!-- 종착 노드 -->
<circle cx="36" cy="63" r="2" fill="#c8503c" opacity="0.75"/>
<!-- ── 오른쪽 페이지: 텍스트 라인 ── -->
<line x1="56" y1="34" x2="78" y2="34" stroke="#9a8465" stroke-width="1.4" stroke-linecap="round"/>
<line x1="56" y1="39" x2="78" y2="39" stroke="#9a8465" stroke-width="1.4" stroke-linecap="round"/>
<line x1="56" y1="44" x2="78" y2="44" stroke="#9a8465" stroke-width="1.4" stroke-linecap="round"/>
<line x1="56" y1="49" x2="70" y2="49" stroke="#9a8465" stroke-width="1.4" stroke-linecap="round"/>
<!-- ── 오른쪽 페이지: EPUB 출력 단자 (골드 #d4a055) ── -->
<!-- IC 사각 단자 A -->
<rect x="57" y="57" width="8" height="8" rx="1.5" fill="none" stroke="#d4a055" stroke-width="1.4"/>
<!-- IC 사각 단자 B -->
<rect x="70" y="57" width="8" height="8" rx="1.5" fill="none" stroke="#d4a055" stroke-width="1.4"/>
<!-- A↔B 수평 연결선 -->
<line x1="65" y1="61" x2="70" y2="61" stroke="#d4a055" stroke-width="1.2"/>
<!-- A 하단 핀 -->
<line x1="61" y1="65" x2="61" y2="69" stroke="#d4a055" stroke-width="1.2"/>
<!-- B 하단 핀 -->
<line x1="74" y1="65" x2="74" y2="69" stroke="#d4a055" stroke-width="1.2"/>
<!-- 핀 끝 솔더 점 -->
<circle cx="61" cy="69.5" r="1.4" fill="#d4a055"/>
<circle cx="74" cy="69.5" r="1.4" fill="#d4a055"/>
<!-- A 내부 채움 (활성 표시) -->
<rect x="59" y="59" width="4" height="4" rx="0.8" fill="#d4a055" opacity="0.35"/>
</svg>